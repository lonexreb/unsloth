# Throwaway probe for #7697 — never merged. Follows the issue's exact repro
# (install.ps1 --local --no-torch, then the managed Scripts\unsloth.exe runs
# studio update --local) on windows-latest. The red job shows what main does
# today: pip dies mid-uninstall and the install is destroyed. The green job
# shows the guard stopping the same run before setup, install intact.
name: probe-7697
on:
  push:
    branches: [probe/7697]
  workflow_dispatch:

jobs:
  red-baseline-on-main:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          repository: unslothai/unsloth
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install.ps1 --local --no-torch
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1 --local --no-torch
      - name: "RED: update --local from the managed unsloth.exe"
        shell: pwsh
        run: |
          $exe = "$env:USERPROFILE\.unsloth\studio\unsloth_studio\Scripts\unsloth.exe"
          $out = & $exe studio update --local 2>&1 | Out-String
          Write-Host $out
          Write-Host "update exit code: $LASTEXITCODE"
      - name: "RED: what is left of the install"
        shell: pwsh
        run: |
          $exe = "$env:USERPROFILE\.unsloth\studio\unsloth_studio\Scripts\unsloth.exe"
          & $exe --version 2>&1 | Out-String | Write-Host
          Write-Host "--version exit code: $LASTEXITCODE"
          & "$env:USERPROFILE\.unsloth\studio\unsloth_studio\Scripts\pip.exe" show unsloth 2>&1 | Out-String | Write-Host

  green-guard-on-fix:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install.ps1 --local --no-torch
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1 --local --no-torch
      - name: "GREEN: the guard stops the self-locked update before setup"
        shell: pwsh
        run: |
          $exe = "$env:USERPROFILE\.unsloth\studio\unsloth_studio\Scripts\unsloth.exe"
          $out = & $exe studio update --local 2>&1 | Out-String
          Write-Host $out
          Write-Host "update exit code: $LASTEXITCODE"
          if ($LASTEXITCODE -ne 1) { throw "expected exit 1 from the guard, got $LASTEXITCODE" }
          if ($out -notmatch "7697") { throw "guard message missing from output" }
          if ($out -match "Uninstalling") { throw "pip reached an uninstall - the guard fired too late" }
      - name: "GREEN: the install is intact after the refused update"
        shell: pwsh
        run: |
          $exe = "$env:USERPROFILE\.unsloth\studio\unsloth_studio\Scripts\unsloth.exe"
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "launcher broken after the refused update" }
          & "$env:USERPROFILE\.unsloth\studio\unsloth_studio\Scripts\pip.exe" show unsloth
          if ($LASTEXITCODE -ne 0) { throw "unsloth package metadata gone" }
      - name: "GREEN (best effort): the printed managed-interpreter re-run works"
        continue-on-error: true
        timeout-minutes: 20
        shell: pwsh
        run: |
          $py = "$env:USERPROFILE\.unsloth\studio\unsloth_studio\Scripts\python.exe"
          $out = & $py -X utf8 -c "from unsloth_cli import app; app()" studio update --local 2>&1 | Out-String
          Write-Host $out
          Write-Host "exit code: $LASTEXITCODE"
          if ($out -match "running from that file") { throw "guard fired for a python.exe launch" }
